name: ads_tap
description: "AdsTap - Create and display advertisements across tabs and screens. Easy ad management platform for businesses."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.5.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  provider: ^6.1.2
  firebase_core: ^2.20.0
  firebase_auth: ^4.10.1
  cloud_firestore: ^4.10.0
  firebase_storage: ^11.5.0
  cached_network_image: ^3.3.1
  image_picker: ^1.0.4
  intl: ^0.19.0
  uuid: ^4.4.0
  email_validator: ^2.1.17
  geolocator: ^9.0.2
  geocoding: ^2.1.0
  dio: ^5.9.0
  flutter_svg: ^2.2.3
  vector_graphics: ^1.1.19

dev_dependencies:

  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  build_runner: ^2.4.6
  flutter_gen: ^5.3.2+1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
    - assets/icon/
    - assets/logo/
    - assets/fonts/

  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700


flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#2196F3"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  remove_alpha_ios: true

flutter_gen:
  output: lib/core/gen/
  line_length: 80


  integrations:
    flutter_svg: true
